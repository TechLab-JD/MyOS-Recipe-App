<div class="app-window" id="RecipeApp">
  <div class="app-header"><span class="app-title">🍳 Recipe Box</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="rb">
      <div class="rb-top"><input id="rb-search" placeholder="Search recipes"><button id="rb-add">+ New</button></div>
      <div class="rb-main"><div id="rb-list" class="rb-list"></div><div id="rb-view" class="rb-view"></div></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
